[save_variables]
filename: ~/printer_data/config/myvariables.cfg

#=================================================
# Restore the last recorded tool state at boot
#=================================================
[delayed_gcode RESTORE_TOOL_STATUS]
initial_duration: 0.1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.current_tool is defined %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={svv.current_tool}
        M118 [System startup] Restored previous tool state: T{svv.current_tool}
    {% else %}
        M118 [System startup] No previous tool state found; defaulting to no tool
    {% endif %}

#=================================================
# [NEW] Automatically disable runout detection at boot
# Note: Right after startup, no tool head is mounted on the print head,
#       so if the runout sensor is in its triggered state it would cause
#       a false alarm.
#       Therefore runout detection is silenced automatically 1 second after boot,
#       and is only re-enabled by the _VERIFY_TOOL_AND_ENABLE_SENSOR macro
#       after a successful tool change.
#=================================================
[delayed_gcode DISABLE_SENSOR_ON_BOOT]
initial_duration: 1.0
gcode:
    # Force runout detection off to avoid false triggers at startup
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [Runout detection] System initialization complete; runout detection silenced by default (will re-enable automatically after a successful tool change)

#=================================================
# [NEW] Runout and tool-change-failure detection sensor configuration
# Note: This sensor has two jobs:
#       1. Filament runout detection during normal printing (Runout Detection)
#       2. Mechanical pickup confirmation after a tool change (Tool Verification)
#
# Hardware wiring: connect the micro switch / runout detector to pin expander:PA9 (active low)
# pause_on_runout: False
#   -> Set to False because we handle the event ourselves in runout_gcode (pause, notify, etc.)
#      instead of letting Klipper use its default pause behavior.
#=================================================
[filament_switch_sensor tool_sensor]
switch_pin: PC14      # Sensor pin; "!" means active low (adjust for normally-closed switches as needed)
pause_on_runout: False         # Disable Klipper's default auto-pause; use custom G-code handling instead
runout_gcode:
    # Triggered when filament is lost during printing (or the sensor pops out)
    # If the feature switch is off, this alarm is ignored
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 1 %}
        { action_respond_info("Error: filament runout during print! Printing paused.") }
        PAUSE
    {% else %}
        M118 [Runout detection] Runout signal detected, but the feature is disabled; ignoring this alarm
    {% endif %}
insert_gcode:
    # Triggered when filament is inserted again (or the sensor is pressed)
    { action_respond_info("Filament inserted; runout state cleared.") }

#=================================================
# 1. Centralized parameters
#=================================================
[gcode_macro _toolchanger_cfg]
description: Tool-change parameter configuration

# --- Tool-change lift, speeds and acceleration ---
variable_z_hop:            0    # Z lift height during tool change (mm)
variable_feed_z:           600    # Z lift speed (mm/min)
variable_feed_fast:        24000  # Fast travel speed (mm/min)
variable_feed_slow:        5000   # Slow speed for loaded / precise alignment moves (mm/min)
variable_accel_toolchange: 15000  # System acceleration during tool changes (prevents motion that is too violent or too slow)
#variable_feed_fast:        18000  # Fast travel speed (mm/min)
#variable_feed_slow:        4000   # Slow speed for loaded / precise alignment moves (mm/min)
#variable_accel_toolchange: 5000  # System acceleration during tool changes (prevents motion that is too violent or too slow)

# --- Tool-change retract / purge settings ---
variable_pickup_retract_len: 3.0  # [Pick up tool] retraction after clamping, before leaving the dock (mm), prevents oozing on the way to the model (!!! Remember to add the same amount of extra extrusion in the slicer's tool-change retraction compensation !!!)
variable_swap_retract_len: 0      # [Release tool] retraction when returning to the dock (mm), prevents oozing
variable_swap_prime_len:   0      # [Pick up tool] extrusion amount on pickup (mm), for purging or compensation
variable_swap_retract_spd: 2000   # Extrude/retract feed rate (mm/min)

# --- Runout / tool-change-failure detection switch ---
# 1 = on:  verify the pickup after a tool change + detect runout during printing
# 0 = off: skip tool-change verification and leave the runout sensor disabled (for debugging / no sensor)
variable_enable_sensor_check: 0

# ========================================================
# [Dock motion logic parameters]
# ========================================================
variable_dock_shift_x: -3    # X lateral shift distance: used to open/close the extruder swing arm
variable_dock_dodge_y: 14    # Y dodge distance: relative displacement of the dodge move
variable_dock_safe_y:  30    # Y safe distance: relative displacement for safely pulling out of the dock

#---------------------------------------------------------
# Absolute coordinates of each hotend (adjust to your actual physical positions)
#---------------------------------------------------------
# T0 config (core coordinates of the dock hole position)
variable_t0_dock_x: 232
variable_t0_dock_y: -20

# T1 config
variable_t1_dock_x: 202
variable_t1_dock_y: -20

# T2 config
variable_t2_dock_x: 172
variable_t2_dock_y: -20

# T3 config
variable_t3_dock_x: 142
variable_t3_dock_y: -20
gcode:
    # Only used to store variables; nothing to execute

#=================================================
# 2. Hotend switching commands (user-level commands)
#=================================================
[gcode_macro T0]
gcode: change_tool T=0

[gcode_macro T1]
gcode: change_tool T=1

[gcode_macro T2]
gcode: change_tool T=2

[gcode_macro T3]
gcode: change_tool T=3

[gcode_macro UNTOOL]
description: Unload the current hotend and switch to the unloaded state
gcode: change_tool T=-1

#=================================================
# 3. State variable storage (runtime record)
#=================================================
[gcode_macro _tool_status]
variable_current_tool: -1
gcode:

#=================================================
# 4. Release-hotend action (low-level action macro)
#=================================================
[gcode_macro _release_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set active_extruder = printer.toolhead.extruder %}

    # Extract the dock parameters of the current nozzle
    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %}
    {% set dodge_y = cfg.dock_dodge_y %}
    {% set safe_y  = cfg.dock_safe_y %}

    M118 --- [T{tool} release] Starting release sequence...

    # --- [A] Release retraction (prevents oozing onto the dock) ---
    {% set cur_temp = printer[active_extruder].temperature|float %}
    {% set min_temp = printer.configfile.settings[active_extruder].min_extrude_temp|default(170)|float %}

    {% if cur_temp >= min_temp %}
       M118 --- [T{tool} release] Temperature OK; performing pre-release retraction...
       M83
       G1 E-{cfg.swap_retract_len} F{cfg.swap_retract_spd}
    {% else %}
       M118 --- [T{tool} release] Current temperature ({cur_temp}°C) too low; skipping retraction
    {% endif %}

    # --- Start the physical release motions ---
    G90

    M118 --- [T{tool} release] Step 1: move to the safe entry point in front of the dock
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

    M118 --- [T{tool} release] Step 2: push straight into the dock base
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}

    M118 --- [T{tool} release] Step 3: shift in X to open the extruder swing arm
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}

    M118 --- [T{tool} release] Step 4: pull out in Y to break the tool's magnetic hold
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}

    M118 --- [T{tool} release] Step 5: shift back in X to safely close the extruder swing arm
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow}

    M118 --- [T{tool} release] Step 6: return to the safe entry point; release complete
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

#=================================================
# 5. Pick-up-hotend action (low-level action macro)
#=================================================
[gcode_macro _pickup_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set current_heater = "extruder" if tool == 0 else ("extruder" ~ tool) %}

    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %}
    {% set dodge_y = cfg.dock_dodge_y %}
    {% set safe_y  = cfg.dock_safe_y %}

    M118 +++ [T{tool} pickup] Starting pickup sequence...

    # --- Start the physical pickup motions ---
    G90

    M118 +++ [T{tool} pickup] Step 1: move to the safe entry point in front of the dock
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

    M118 +++ [T{tool} pickup] Step 2: move to the dodge position (avoid hitting the docked hotend)
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast}

    M118 +++ [T{tool} pickup] Step 3: shift in X, preparing to cut in
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}

    M118 +++ [T{tool} pickup] Step 4: push into the base; magnetic engagement
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}

    M118 +++ [T{tool} pickup] Step 5: shift back in X to clamp the filament
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}

    # --- Prime extrusion inside the dock ---
    {% set cur_temp = printer[current_heater].temperature|float %}
    {% set min_temp = printer.configfile.settings[current_heater].min_extrude_temp|default(170)|float %}

    {% if cur_temp >= min_temp %}
         M118 +++ [T{tool} pickup] Temperature OK; performing pickup prime extrusion...
         M83
         G1 E{cfg.swap_prime_len} F{cfg.swap_retract_spd}
    {% else %}
         M118 +++ [T{tool} pickup] Current temperature ({cur_temp}°C) too low; skipping prime extrusion
    {% endif %}

    # --- [NEW] Retract after clamping, to prevent oozing between leaving the dock and reaching the model ---
    {% if cur_temp >= min_temp and cfg.pickup_retract_len > 0 %}
     M118 +++ [T{tool} pickup] Performing post-pickup retraction of {cfg.pickup_retract_len}mm to prevent oozing en route...
     M83
     G1 E-{cfg.pickup_retract_len} F{cfg.swap_retract_spd}
    {% endif %}

    M118 +++ [T{tool} pickup] Step 6: return to the safe entry point with the tool; pickup complete
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

#=================================================
# [NEW] 6. Tool-change result verification and runout-detection control macro
#
# Description:
#   This macro is called as the last step of the tool-change sequence, and is used to:
#   1. Verify the tool change succeeded: read the state of the micro switch /
#      runout sensor to determine whether the print head actually picked up the
#      new tool (sensor pressed by filament = normal).
#   2. Manage runout detection: after verification passes, automatically enable
#      the runout sensor monitoring; if verification fails (sensor not triggered),
#      it is treated as a failed tool change or a new nozzle with no filament,
#      and printing is paused immediately to avoid dry printing that would damage
#      the model or the nozzle.
#
# When it is called:
#   Only after the change_tool macro has completed all physical pickup motions.
#   If new_tool == -1 (unloaded state), this macro is not called.
#=================================================
[gcode_macro _VERIFY_TOOL_AND_ENABLE_SENSOR]
description: Verify the tool change and handle the result
gcode:
    {% set new_tool = params.NEW_TOOL|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set sensor_on = cfg.enable_sensor_check|int %}

    # If the user has disabled sensor checks, skip verification, record success and keep the sensor off
    {% if sensor_on == 0 %}
        M118 [Tool-change verification] Sensor checking is disabled; skipping pickup verification and runout monitoring.
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        {% set svv = printer.save_variables.variables %}
        {% set total_changes = svv.total_tool_changes | default(0) | int + 1 %}
        SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={total_changes}
        SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
        M118 [Tool-change dispatch] Tool change fully completed (checks disabled). Total tool changes so far: {total_changes}
    {% else %}
        {% set has_filament = printer["filament_switch_sensor tool_sensor"].filament_detected %}

        {% if has_filament %}
            # ------- Case: success -------
            M118 [Tool-change verification] Sensor state normal; tool change succeeded.
            SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1

            {% set svv = printer.save_variables.variables %}
            {% set total_changes = svv.total_tool_changes | default(0) | int + 1 %}
            SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={total_changes}
            SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
            M118 [Tool-change dispatch] Tool change fully completed. Total tool changes so far: {total_changes}

        {% else %}
            # ------- Case: failure -------
            M118 [Tool-change verification] !!! Warning: no filament detected; check the pickup !!!
            { action_respond_info("Tool change may have failed or there is no filament; the system has paused. Resume manually after checking.") }
            PAUSE
        {% endif %}
    {% endif %}
#=================================================
# 7. Main tool-change macro (core dispatcher)
#=================================================
[gcode_macro change_tool]
gcode:
    {% set new_tool = params.T|default(-1)|int %}
    {% set old_tool = printer["gcode_macro _tool_status"].current_tool|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}

    {% if new_tool == old_tool %}
        M118 [Tool-change dispatch] Target tool matches the current tool (T{new_tool}); no action needed
    {% else %}
        {% if new_tool == -1 %}
            M118 [Tool-change dispatch] Unload command received; preparing to return T{old_tool} to the dock...
        {% else %}
            M118 [Tool-change dispatch] Starting tool change: switching from T{old_tool} to T{new_tool}
        {% endif %}

        # 1. Save the current state
        M118 [Tool-change dispatch] Saving pre-change coordinate state and switching to tool-change acceleration...
        SAVE_GCODE_STATE NAME=tool_change
        {% set saved_accel = printer.toolhead.max_accel %}
        SET_VELOCITY_LIMIT ACCEL={cfg.accel_toolchange}

        # ============================================================
        # [NEW] Mask runout detection before the tool change
        # Reason: During a tool change the print head leaves the model area and
        #         filament is retracted/extruded, so the sensor state is unstable.
        #         Monitoring must be turned off temporarily to avoid a false
        #         runout alarm in the middle of the change.
        # ============================================================
        M118 [Tool-change dispatch] Temporarily disabling runout detection to avoid interference from the tool change...
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0

        # 2. Lift Z
        M118 [Tool-change dispatch] Lifting Z by {cfg.z_hop}mm (relative)...
        G91
        G0 Z{cfg.z_hop} F{cfg.feed_z}
        G90

        # 3. Clear coordinate offsets
        M118 [Tool-change dispatch] Temporarily clearing coordinate offsets; using absolute machine coordinates...
        SET_GCODE_OFFSET X=0 Y=0 Z=0

        # 4. Release the old tool
        {% if old_tool != -1 %}
            _release_tool TOOL={old_tool}
        {% else %}
            M118 [Tool-change dispatch] Currently unloaded; skipping the release step
        {% endif %}

        # 5. Pick up the new tool
        {% if new_tool != -1 %}
            {% set next_heater = "extruder" if new_tool == 0 else ("extruder" ~ new_tool) %}
            {% set target_temp = printer[next_heater].target|float %}

            # Temperature check and wait
            {% if target_temp > 0 %}
                {% if printer[next_heater].temperature < (target_temp - 2) %}
                    M118 [Tool-change dispatch] T{new_tool} not at temperature; waiting to heat to {target_temp}°C...
                    TEMPERATURE_WAIT SENSOR={next_heater} MINIMUM={target_temp}
                {% endif %}
            {% endif %}

            _pickup_tool TOOL={new_tool}
        {% else %}
            M118 [Tool-change dispatch] Target is the unloaded state (-1); no new tool will be picked up
        {% endif %}

        # 6. Update the in-memory state
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={new_tool}

        # 7. Restore the original position and acceleration
        M118 [Tool-change dispatch] Restoring the physical position and print acceleration from before the change...
        RESTORE_GCODE_STATE NAME=tool_change MOVE=0
        SET_VELOCITY_LIMIT ACCEL={saved_accel}

         # 8. Read and apply the new tool's offsets
        {% set svv = printer.save_variables.variables %}
        {% if new_tool != -1 %}
            {% set off_x = svv["t" ~ new_tool ~ "_offset_x"] | default(0.0) | float %}
            {% set off_y = svv["t" ~ new_tool ~ "_offset_y"] | default(0.0) | float %}
            {% set off_z = svv["t" ~ new_tool ~ "_offset_z"] | default(0.0) | float %}
            SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
            M118 [Tool-change dispatch] Loading T{new_tool} offsets: X={off_x} Y={off_y} Z={off_z}
        {% endif %}

        # 9. Run verification (key point: pass new_tool to it)
        {% if new_tool != -1 %}
            M118 [Tool-change dispatch] Waiting for motion to stop, preparing to verify...
            #M400
            _VERIFY_TOOL_AND_ENABLE_SENSOR NEW_TOOL={new_tool}
        {% else %}
            # If unloading the tool (T=-1), just update the state
            SAVE_VARIABLE VARIABLE=current_tool VALUE=-1
            M118 [Tool-change dispatch] Tool unloaded successfully; now in the unloaded state.
        {% endif %}

    {% endif %}

#=================================================
# 8. Tool-change counter utilities (user-callable commands)
#=================================================
[gcode_macro GET_TOOL_CHANGE_COUNT]
description: Query the current cumulative total of tool changes
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set total_changes = svv.total_tool_changes | default(0) | int %}
    M118 [Tool-change stats] Current cumulative total of tool changes: {total_changes}

[gcode_macro RESET_TOOL_CHANGE_COUNT]
description: Reset the total tool-change counter to 0
gcode:
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    M118 [Tool-change stats] Historical total tool-change count has been reset to 0

#=================================================
# 8.5 Runout detection / tool-change-failure detection switch
#=================================================
# When off: tool changes are not verified and don't pause; the runout sensor stays off and no alarm is raised while printing
# At boot it follows enable_sensor_check (default 1 = on)
#=================================================
[gcode_macro DISABLE_TOOL_SENSOR]
description: Disable tool-change-failure detection and runout detection
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=0
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [Runout detection] Disabled: tool-change verification and runout alarm are both off

[gcode_macro ENABLE_TOOL_SENSOR]
description: Enable tool-change-failure detection and runout detection
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=1
    {% set cur = printer["gcode_macro _tool_status"].current_tool|int %}
    {% if cur != -1 %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1
        M118 [Runout detection] Enabled: tool-change verification + runout alarm (T{cur} currently mounted; sensor active)
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        M118 [Runout detection] Enabled: tool-change verification + runout alarm (currently unloaded; sensor not yet active, will activate automatically after a successful tool change)
    {% endif %}

[gcode_macro GET_TOOL_SENSOR_STATUS]
description: Query the current state of the runout / tool-change detection switch
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set on = cfg.enable_sensor_check|int %}
    {% set sensor_enabled = printer["filament_switch_sensor tool_sensor"].enabled %}
    {% set has_filament = printer["filament_switch_sensor tool_sensor"].filament_detected %}
    {% if on == 1 %}
        M118 [Runout detection] Feature switch: ON | Actual sensor state: {"active" if sensor_enabled else "inactive"} | Filament currently detected: {"yes" if has_filament else "no"}
    {% else %}
        M118 [Runout detection] Feature switch: OFF (tool changes not verified, no alarm while printing) | Actual sensor state: {"active" if sensor_enabled else "inactive"}
    {% endif %}

#=================================================
# 9. Take over M109 (heat and wait)
#=================================================
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target_temp = s if s > 0 else r %}
    {% set tool_index = params.T|default(-1)|int %}
    {% set sensor_name = printer.toolhead.extruder %}

    # Fix: make sure the correct macro variable name, current_tool, is used
    {% if tool_index == -1 %}
        {% set current_tool = printer["gcode_macro _tool_status"].current_tool|int %}
        {% set tool_index = current_tool %}
        M118 [M109 heating] No T parameter given; defaulting to the currently mounted tool head: T{current_tool}
    {% endif %}

    {% if tool_index != -1 %}
        {% if tool_index == 0 %}
            {% set sensor_name = "extruder" %}
        {% else %}
            {% set sensor_name = "extruder" ~ tool_index %}
        {% endif %}
    {% endif %}

    {% if target_temp > 0 %}
        M118 [M109 heating] Heating {sensor_name} to {target_temp}°C and waiting for it to stabilize...
        {% if tool_index != -1 %}
            M104 S{target_temp} T{tool_index}
        {% else %}
            M104 S{target_temp}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={target_temp - 1.0}
        M118 [M109 heating] Temperature reached!
    {% endif %}
